<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreateAccount</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

        --background: #fdfcf8;
        --foreground: #2d2b26;
        --primary: #d95a40;
        --primary-foreground: #fdfcf8;
        --secondary: #5a6b41;
        --secondary-foreground: #fdfcf8;
        --muted: #f4efe6;
        --muted-foreground: #8f8d84;
        --accent: #f4efe6;
        --accent-foreground: #2d2b26;
        --destructive: #c47055;
        --destructive-foreground: #fdfcf8;
        --card: #f4efe6;
        --card-foreground: #2d2b26;
        --popover: #fdfcf8;
        --popover-foreground: #2d2b26;
        --border: #eae5db;
        --input: #f4efe6;
        --ring: #d95a40;
        --chart-1: #d95a40;
        --chart-2: #5a6b41;
        --chart-3: #c9a227;
        --chart-4: #8f8d84;
        --chart-5: #c47055;

        --font-sans: "Inter", sans-serif;
        --font-heading: "Fraunces", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="flex min-h-[844px] w-full max-w-[390px] mx-auto flex-col bg-background px-6 pb-10 pt-14 text-foreground"
    >
      <div class="flex items-center">
        <a
          href="sign-in.html"
          class="flex size-10 items-center justify-center rounded-full bg-card text-foreground"
          ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display:inline-block;flex-shrink:0;vertical-align:middle;width:20px;height:20px;"><path fill="currentColor" d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z"/></svg></a>
      </div>
      <div class="mt-6">
        <h1 class="font-heading text-3xl font-semibold tracking-tight">Create your account</h1>
        <p class="mt-2 text-sm text-muted-foreground">
          Join Batya's Kitchen for homestyle kosher meals delivered to your door.
        </p>
      </div>
      <form class="mt-8 flex flex-col gap-4">
        <label class="flex flex-col gap-2"
          ><span class="text-sm font-medium">Full name</span
          ><input
            type="text"
            class="h-14 w-full rounded-2xl border border-border bg-input px-4 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            placeholder="Batya Cohen" /></label
        ><label class="flex flex-col gap-2"
          ><span class="text-sm font-medium">Email</span
          ><input
            type="email"
            class="h-14 w-full rounded-2xl border border-border bg-input px-4 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            placeholder="you@example.com" /></label
        ><label class="flex flex-col gap-2"
          ><span class="text-sm font-medium">Phone</span
          ><input
            type="tel"
            class="h-14 w-full rounded-2xl border border-border bg-input px-4 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            placeholder="(917) 555-0100" /></label
        ><label class="flex flex-col gap-2"
          ><span class="text-sm font-medium">Password</span
          ><input
            type="password"
            class="h-14 w-full rounded-2xl border border-border bg-input px-4 text-base placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            placeholder="At least 8 characters"
        /></label>
      </form>
      <p class="mt-4 text-xs leading-relaxed text-muted-foreground">
        By creating an account you agree to receive order updates from Batya's Kitchen.
      </p>
      <div class="mt-auto flex flex-col gap-6 pt-10">
        <a
          href="home.html"
          class="flex h-14 w-full items-center justify-center rounded-2xl bg-primary text-base font-semibold text-primary-foreground shadow-sm"
          >Create Account</a
        >
        <p class="text-center text-sm text-muted-foreground">
          Already have an account? <a href="sign-in.html" class="font-semibold text-primary">Sign In</a>
        </p>
      </div>
    </div>
  </body>
</html>
